<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2000s 热量计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 豹紋背景 + 8-bit 像素感 */
        body {
            min-height: 100vh;
            background-color: #f7e9c3;
            background-image: 
                radial-gradient(circle at 10% 20%, #8b5a2b 2px, transparent 2px),
                radial-gradient(circle at 25% 70%, #5a3e1b 3px, transparent 3px),
                radial-gradient(circle at 80% 15%, #b87c4b 4px, transparent 4px),
                radial-gradient(circle at 92% 85%, #3f2a0f 2px, transparent 2px),
                radial-gradient(circle at 40% 40%, #c99a6b 5px, transparent 5px),
                radial-gradient(circle at 65% 55%, #7a4f1e 3px, transparent 3px),
                radial-gradient(circle at 15% 90%, #dbb47a 3px, transparent 3px),
                radial-gradient(circle at 70% 30%, #4d2e0e 4px, transparent 4px),
                repeating-linear-gradient(45deg, #e6d5b5 0px, #e6d5b5 4px, #dac292 4px, #dac292 8px);
            background-size: 200px 200px, 180px 180px, 220px 220px, 190px 190px, 250px 250px, 170px 170px, 210px 210px, 230px 230px, 100% 100%;
            font-family: 'Press Start 2P', 'Courier New', monospace, 'VT323', 'Segoe UI', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* 仿古早8bit主面板 */
        .pixel-panel {
            background-color: #fef7e0;
            border: 6px solid #634b2c;
            box-shadow: 
                0 0 0 4px #ffd966,
                0 0 0 8px #aa7e4b,
                12px 12px 0 0 #3f2e18;
            max-width: 1000px;
            width: 100%;
            padding: 30px 25px 25px 25px;
            position: relative;
            margin-bottom: 20px;
        }

        /* 像素風裝飾圖標（千禧感） */
        .pixel-deco {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 30px;
            line-height: 1;
            filter: drop-shadow(3px 3px 0 #a57c4b);
            letter-spacing: 6px;
        }

        .deco-left, .deco-right {
            display: flex;
            gap: 12px;
        }

        .pixel-star {
            color: #ffb347;
            text-shadow: 2px 2px 0 #a0522d, 4px 4px 0 #2e1e0e;
            font-size: 34px;
        }

        .pixel-heart {
            color: #ff4d6d;
            text-shadow: 2px 2px 0 #a52a2a, 4px 4px 0 #4d0f0f;
            font-size: 34px;
        }

        .pixel-joystick {
            color: #8b6b4d;
            text-shadow: 3px 3px 0 #513b1f, 5px 5px 0 #1f1508;
            font-size: 40px;
            transform: rotate(-10deg);
        }

        /* 格子區域 */
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 18px;
        }

        @media (max-width: 700px) {
            .grid-2col {
                grid-template-columns: 1fr;
            }
        }

        /* 8bit 按鈕與輸入 */
        select, input, button {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 14px;
            padding: 10px 12px;
            border: 4px solid #3f2e18;
            background-color: #f2e3c2;
            color: #1c1208;
            border-radius: 0;
            box-shadow: 4px 4px 0 #6b4f2b;
            outline: none;
            image-rendering: pixelated;
            transition: all 0.05s ease;
        }

        select:focus, input:focus, button:focus {
            background-color: #fff5d6;
            box-shadow: 2px 2px 0 #6b4f2b;
            transform: translate(2px, 2px);
        }

        button {
            background-color: #d9b382;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 6px 6px 0 #3f2e18;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #3f2e18;
        }

        /* 食物清單格子 */
        .food-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-top: 15px;
            max-height: 260px;
            overflow-y: auto;
            padding: 12px 10px;
            border: 4px solid #b38b5b;
            background-color: #fff3da;
            box-shadow: inset 0 0 0 3px #e6c8a0, inset 0 0 0 6px #b38b5b;
        }

        .food-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-family: 'VT323', 'Courier New', monospace;
            font-weight: bold;
            background: #faeac9;
            padding: 6px 10px;
            border: 3px solid #7b5e3b;
            box-shadow: 3px 3px 0 #5c4327;
            color: #2a1d0c;
        }

        .food-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #b3623b;
            box-shadow: none;
            transform: scale(1.1);
            margin-right: 4px;
        }

        /* 自訂食物輸入區 */
        .custom-food-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin: 15px 0 8px;
        }

        .custom-food-row input {
            flex: 2;
            min-width: 150px;
        }

        .custom-food-row input[type="number"] {
            flex: 1;
            min-width: 90px;
        }

        /* 熱量顯示大字 */
        .calorie-display {
            background: #2d1f0e;
            color: #ffe484;
            padding: 18px 10px;
            border: 6px solid #f7c35c;
            box-shadow: 0 0 0 4px #9b7b4b, 8px 8px 0 #3a2b14;
            text-align: center;
            font-size: 26px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            margin: 18px 0 12px;
            letter-spacing: 4px;
            text-shadow: 3px 3px 0 #6b4f1b;
        }

        .calorie-display span {
            color: #f5b942;
            font-size: 40px;
            display: inline-block;
            margin-left: 10px;
        }

        .target-info {
            background: #b4925c;
            border: 4px solid #3a2a12;
            padding: 10px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #1f1406;
            box-shadow: 4px 4px 0 #2b1f0c;
            margin: 12px 0;
            text-transform: uppercase;
        }

        /* 建議框 */
        .advice-box {
            background: #feebc0;
            border: 6px double #8a6a3a;
            padding: 18px 16px;
            font-size: 16px;
            line-height: 1.6;
            color: #2b1b05;
            margin-top: 20px;
            box-shadow: 8px 8px 0 #7a5b36;
            font-family: 'VT323', 'Courier New', monospace;
            font-weight: bold;
            word-break: break-word;
        }

        .advice-box strong {
            color: #b13e3e;
            font-size: 18px;
        }

        /* 8bit 小標籤 */
        .pixel-label {
            display: inline-block;
            background: #b48b4b;
            color: #1a1205;
            padding: 6px 12px;
            border: 3px solid #4d381c;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 6px;
            box-shadow: 3px 3px 0 #2e2110;
            text-transform: uppercase;
        }

        /* 性別/年齡/活動量 排列 */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            background: #e8d7b0;
            padding: 10px 12px;
            border: 4px solid #9b7b4b;
            box-shadow: inset 0 0 0 3px #f3e2c2;
        }

        .form-row label {
            font-size: 15px;
            font-weight: bold;
            min-width: 70px;
            color: #301f0a;
        }

        .form-row select, .form-row input {
            flex: 1;
            font-size: 14px;
        }

        /* 捲軸美化 (復古) */
        ::-webkit-scrollbar {
            width: 16px;
            background: #c1a177;
        }

        ::-webkit-scrollbar-thumb {
            background: #7a5b36;
            border: 3px solid #c9a86a;
            box-shadow: inset 0 0 0 2px #4e3920;
        }

        /* 8bit 小精靈裝飾 */
        .pixel-ghost {
            font-size: 28px;
            text-shadow: 2px 2px 0 #53401f;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="pixel-panel">
        <!-- 復古像素裝飾 -->
        <div class="pixel-deco">
            <div class="deco-left">
                <span class="pixel-star">★</span>
                <span class="pixel-heart">♥</span>
                <span class="pixel-joystick">🕹️</span>
            </div>
            <div class="deco-right">
                <span class="pixel-ghost">👾</span>
                <span class="pixel-star">★</span>
                <span class="pixel-heart">♥</span>
            </div>
        </div>

        <!-- 年齡 / 性別 / 活動量 輸入區 -->
        <div class="grid-2col" style="grid-template-columns: 1fr 1fr 1.2fr;">
            <div class="form-row" style="flex-direction: column; align-items: stretch;">
                <label>🎂 年齡</label>
                <select id="ageSelect">
                    <option value="12-14">12-14 歲</option>
                    <option value="15-18">15-18 歲</option>
                    <option value="19-30">19-30 歲</option>
                    <option value="31-50">31-50 歲</option>
                    <option value="51-70">51-70 歲</option>
                    <option value="71+">71 歲以上</option>
                </select>
            </div>
            <div class="form-row" style="flex-direction: column; align-items: stretch;">
                <label>⚥ 性別</label>
                <select id="genderSelect">
                    <option value="female">女性</option>
                    <option value="male">男性</option>
                </select>
            </div>
            <div class="form-row" style="flex-direction: column; align-items: stretch;">
                <label>🏃 活動量</label>
                <select id="activitySelect">
                    <option value="1.2">久坐 (1.2)</option>
                    <option value="1.375">輕度 (1.375)</option>
                    <option value="1.55">中度 (1.55)</option>
                    <option value="1.725">高度 (1.725)</option>
                    <option value="1.9">非常活躍 (1.9)</option>
                </select>
            </div>
        </div>

        <!-- 食物清單 + 勾選 -->
        <div style="margin-top: 8px;">
            <div class="pixel-label">🍔 常見食物清單 (勾選)</div>
            <div id="foodListContainer" class="food-list">
                <!-- 由 JS 動態產生 -->
            </div>
        </div>

        <!-- 自訂輸入 -->
        <div class="custom-food-row">
            <input type="text" id="customName" placeholder="自訂食物名稱" style="flex: 2;">
            <input type="number" id="customCalories" placeholder="熱量 (大卡)" min="0" step="1" value="">
            <button id="addCustomBtn" style="flex: 0.8;">➕ 新增</button>
        </div>

        <!-- 今日攝取熱量顯示 -->
        <div class="calorie-display">
            🔥 今日攝取 <span id="totalCalories">0</span> 大卡
        </div>

        <!-- 建議目標熱量 -->
        <div class="target-info" id="targetInfo">
            建議目標：--- 大卡
        </div>

        <!-- 健康建議輸出 -->
        <div class="advice-box" id="adviceBox">
            💬 選擇食物或輸入熱量，我會給你建議！
        </div>
    </div>

    <script>
        // ----- 食物資料庫 (常見食物 + 熱量) -----
        const foodDatabase = [
            { name: "白飯 (1碗)", cal: 280 },
            { name: "雞胸肉 (100g)", cal: 165 },
            { name: "滷蛋 (1顆)", cal: 75 },
            { name: "全麥吐司 (1片)", cal: 70 },
            { name: "牛奶 (250ml)", cal: 150 },
            { name: "豆漿 (無糖)", cal: 60 },
            { name: "蘋果 (中型)", cal: 95 },
            { name: "香蕉 (中型)", cal: 105 },
            { name: "薯條 (中份)", cal: 340 },
            { name: "炸雞腿", cal: 280 },
            { name: "可樂 (330ml)", cal: 139 },
            { name: "珍珠奶茶 (500ml)", cal: 380 },
            { name: "炒青菜 (1份)", cal: 90 },
            { name: "鮭魚 (100g)", cal: 208 },
            { name: "義大利麵 (1份)", cal: 320 },
            { name: "披薩 (1片)", cal: 285 },
            { name: "美式咖啡 (黑)", cal: 5 },
            { name: "冰淇淋 (1球)", cal: 140 }
        ];

        // 存放所有食物項目 (包含自訂) 的 DOM 參考與熱量資料
        let allFoodItems = []; // { id, name, cal, checked, domCheckbox }

        // 用於唯一 ID
        let customIdCounter = 0;

        // ----- 初始化食物清單 (靜態常見食物) -----
        function initFoodList() {
            const container = document.getElementById('foodListContainer');
            container.innerHTML = '';

            // 先清空 allFoodItems 中非自訂的舊資料 (若重新初始化)
            // 保留自訂項目：但初始化只執行一次，所以可全部重建
            allFoodItems = [];

            foodDatabase.forEach((food, index) => {
                const itemId = `food-${index}`;
                const div = document.createElement('div');
                div.className = 'food-item';
                div.innerHTML = `
                    <input type="checkbox" id="${itemId}" data-cal="${food.cal}" data-name="${food.name}" class="food-checkbox">
                    <label for="${itemId}">${food.name} <span style="color:#9e5e1e;">${food.cal}大卡</span></label>
                `;
                container.appendChild(div);

                // 儲存參考
                const checkbox = div.querySelector('input');
                allFoodItems.push({
                    id: itemId,
                    name: food.name,
                    cal: food.cal,
                    domCheckbox: checkbox,
                    custom: false
                });

                // 綁定事件
                checkbox.addEventListener('change', updateTotalAndAdvice);
            });
        }

        // ----- 新增自訂食物 -----
        function addCustomFood() {
            const nameInput = document.getElementById('customName');
            const calInput = document.getElementById('customCalories');
            const name = nameInput.value.trim();
            const cal = parseFloat(calInput.value);

            if (!name) {
                alert('請輸入食物名稱！');
                return;
            }
            if (isNaN(cal) || cal < 0) {
                alert('請輸入有效的熱量數字 (≥0)');
                return;
            }

            const container = document.getElementById('foodListContainer');
            const itemId = `custom-${customIdCounter++}`;

            const div = document.createElement('div');
            div.className = 'food-item';
            div.innerHTML = `
                <input type="checkbox" id="${itemId}" data-cal="${cal}" data-name="${name}" class="food-checkbox" checked>
                <label for="${itemId}">${name} <span style="color:#9e5e1e;">${cal}大卡</span> (自訂)</label>
            `;
            container.appendChild(div);

            const checkbox = div.querySelector('input');
            allFoodItems.push({
                id: itemId,
                name: name,
                cal: cal,
                domCheckbox: checkbox,
                custom: true
            });

            checkbox.addEventListener('change', updateTotalAndAdvice);

            // 清空輸入
            nameInput.value = '';
            calInput.value = '';

            // 立即更新總和與建議
            updateTotalAndAdvice();
        }

        // ----- 計算每日建議熱量 (使用 Harris-Benedict 公式) -----
        function calculateRecommendedCalories() {
            const ageRange = document.getElementById('ageSelect').value;
            const gender = document.getElementById('genderSelect').value;
            const activity = parseFloat(document.getElementById('activitySelect').value);

            // 取得代表年齡 (取中間值)
            let age = 25; // 預設
            switch (ageRange) {
                case '12-14': age = 13; break;
                case '15-18': age = 16.5; break;
                case '19-30': age = 24.5; break;
                case '31-50': age = 40.5; break;
                case '51-70': age = 60.5; break;
                case '71+': age = 75; break;
            }

            // 體重/身高簡化假設：以年齡性別調整 (因無身高體重輸入，使用標準參考值)
            let weight, height;
            if (gender === 'female') {
                weight = 55;
                height = 160;
                if (age < 18) weight = 50;
                else if (age > 60) weight = 52;
            } else {
                weight = 65;
                height = 170;
                if (age < 18) weight = 60;
                else if (age > 60) weight = 63;
            }

            // Mifflin-St Jeor 公式
            let bmr;
            if (gender === 'female') {
                bmr = 10 * weight + 6.25 * height - 5 * age - 161;
            } else {
                bmr = 10 * weight + 6.25 * height - 5 * age + 5;
            }

            // 每日總消耗 = BMR * 活動係數
            let tdee = bmr * activity;
            return Math.round(tdee);
        }

        // ----- 更新總熱量、建議與建議內容 -----
        function updateTotalAndAdvice() {
            // 1. 計算今日攝取總熱量
            let total = 0;
            allFoodItems.forEach(item => {
                if (item.domCheckbox && item.domCheckbox.checked) {
                    total += item.cal;
                }
            });
            document.getElementById('totalCalories').textContent = total;

            // 2. 計算建議熱量
            const recommended = calculateRecommendedCalories();
            document.getElementById('targetInfo').textContent = `建議目標：${recommended} 大卡 (每日)`;

            // 3. 生成個性化建議
            const adviceBox = document.getElementById('adviceBox');
            const diff = total - recommended;
            const absDiff = Math.abs(diff);
            let adviceHtml = '';

            if (total === 0) {
                adviceHtml = `🍽️ 今天還沒吃東西嗎？建議攝取約 <strong>${recommended}</strong> 大卡，可從優質蛋白質與全穀類開始！`;
            } else if (diff > 300) {
                adviceHtml = `⚠️ 今日攝取 <strong>${total}</strong> 大卡，超出建議 <strong>${diff}</strong> 大卡。<br>`;
                adviceHtml += `🏃‍♂️ 建議增加運動（如快走30分鐘）並減少高油、高糖食物（例如炸物、含糖飲料）。`;
            } else if (diff > 100) {
                adviceHtml = `🔸 今日攝取 <strong>${total}</strong> 大卡，稍微超出建議 <strong>${diff}</strong> 大卡。<br>`;
                adviceHtml += `🥗 可以減少一份點心或飲料，並多走動一下！`;
            } else if (diff < -300) {
                adviceHtml = `⚠️ 今日攝取 <strong>${total}</strong> 大卡，不足建議 <strong>${absDiff}</strong> 大卡。<br>`;
                adviceHtml += `🍗 建議補充優質蛋白質（雞胸肉、豆製品）與健康油脂（堅果），並確保足夠的碳水化合物。`;
            } else if (diff < -100) {
                adviceHtml = `🔸 今日攝取 <strong>${total}</strong> 大卡，略低於建議 <strong>${absDiff}</strong> 大卡。<br>`;
                adviceHtml += `🥛 可以增加一份水果或乳製品，補足熱量與營養。`;
            } else {
                adviceHtml = `✅ 今日攝取 <strong>${total}</strong> 大卡，與建議目標 <strong>${recommended}</strong> 大卡非常接近！<br>`;
                adviceHtml += `🎉 繼續保持均衡飲食，多喝水，維持良好作息！`;
            }

            // 加上性別/年齡提醒
            const genderText = document.getElementById('genderSelect').value === 'female' ? '女性' : '男性';
            const ageText = document.getElementById('ageSelect').value;
            adviceHtml += `<br><br>📌 你的設定：${ageText} ${genderText} / 活動量 ${document.getElementById('activitySelect').selectedOptions[0].text}`;

            adviceBox.innerHTML = adviceHtml;
        }

        // ----- 監聽年齡/性別/活動量變化，重新計算建議 -----
        function setupListeners() {
            document.getElementById('ageSelect').addEventListener('change', updateTotalAndAdvice);
            document.getElementById('genderSelect').addEventListener('change', updateTotalAndAdvice);
            document.getElementById('activitySelect').addEventListener('change', updateTotalAndAdvice);

            document.getElementById('addCustomBtn').addEventListener('click', addCustomFood);

            document.getElementById('customName').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addCustomFood();
                }
            });
            document.getElementById('customCalories').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addCustomFood();
                }
            });
        }

        // ----- 頁面載入 -----
        window.addEventListener('load', () => {
            initFoodList();
            setupListeners();
            updateTotalAndAdvice();
        });

    </script>
</body>
</html>
