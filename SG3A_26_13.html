<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2000s 热量计算器</title>
    <style>
        body {
            background-color: #e6d5b5;
            font-family: 'Courier New', monospace;
            padding: 20px;
            color: #000;
        }
        .panel {
            background-color: #fef7e0;
            border: 5px solid #634b2c;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            box-shadow: 10px 10px 0 #3f2e18;
        }
        h1 {
            text-align: center;
            color: #b13e3e;
        }
        select, input, button {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            padding: 8px;
            border: 3px solid #3f2e18;
            background-color: #f2e3c2;
            margin: 5px 0;
        }
        button {
            background-color: #d9b382;
            cursor: pointer;
            font-weight: bold;
        }
        .food-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
            max-height: 200px;
            overflow-y: auto;
            border: 3px solid #b38b5b;
            padding: 10px;
        }
        .food-item {
            display: flex;
            align-items: center;
            background: #faeac9;
            padding: 5px;
            border: 2px solid #7b5e3b;
        }
        .calorie-display {
            background: #2d1f0e;
            color: #ffe484;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            margin: 20px 0;
            border: 4px solid #f7c35c;
        }
        .advice-box {
            background: #feebc0;
            border: 4px dashed #8a6a3a;
            padding: 15px;
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h1>2000s 热量计算器</h1>

        <!-- 年龄 / 性别 / 活动量 -->
        <div>
            <label>🎂 年龄：</label>
            <select id="ageSelect">
                <option value="12-14">12-14 岁</option>
                <option value="15-18">15-18 岁</option>
                <option value="19-30">19-30 岁</option>
                <option value="31-50">31-50 岁</option>
                <option value="51-70">51-70 岁</option>
                <option value="71+">71 岁以上</option>
            </select>
            
            <label>⚥ 性别：</label>
            <select id="genderSelect">
                <option value="female">女性</option>
                <option value="male">男性</option>
            </select>
            
            <label>🏃 活动量：</label>
            <select id="activitySelect">
                <option value="1.2">久坐 (1.2)</option>
                <option value="1.375">轻度 (1.375)</option>
                <option value="1.55">中度 (1.55)</option>
                <option value="1.725">高度 (1.725)</option>
                <option value="1.9">非常活跃 (1.9)</option>
            </select>
        </div>

        <!-- 食物清单 -->
        <h3>🍔 常见食物清单 (勾选)</h3>
        <div id="foodListContainer" class="food-list"></div>

        <!-- 自定义输入 -->
        <div>
            <input type="text" id="customName" placeholder="自订食物名称">
            <input type="number" id="customCalories" placeholder="热量 (大卡)">
            <button id="addCustomBtn">➕ 新增</button>
        </div>

        <!-- 热量显示 -->
        <div class="calorie-display">
            🔥 今日摄取 <span id="totalCalories">0</span> 大卡
        </div>
        <div id="targetInfo" style="text-align:center; font-weight:bold; margin-bottom:10px;">
            建议目标：--- 大卡
        </div>

        <!-- 建议 -->
        <div class="advice-box" id="adviceBox">
            💬 选择食物或输入热量，我会给你建议！
        </div>
    </div>

    <script>
        const foodDatabase = [
            { name: "白饭 (1碗)", cal: 280 },
            { name: "鸡胸肉 (100g)", cal: 165 },
            { name: "卤蛋 (1颗)", cal: 75 },
            { name: "全麦吐司 (1片)", cal: 70 },
            { name: "牛奶 (250ml)", cal: 150 },
            { name: "豆浆 (无糖)", cal: 60 },
            { name: "苹果 (中型)", cal: 95 },
            { name: "香蕉 (中型)", cal: 105 },
            { name: "薯条 (中份)", cal: 340 },
            { name: "炸鸡腿", cal: 280 },
            { name: "可乐 (330ml)", cal: 139 },
            { name: "珍珠奶茶 (500ml)", cal: 380 }
        ];

        let allFoodItems = [];
        let customIdCounter = 0;

        function initFoodList() {
            const container = document.getElementById('foodListContainer');
            container.innerHTML = '';
            allFoodItems = [];
            
            foodDatabase.forEach((food, index) => {
                const itemId = `food-${index}`;
                const div = document.createElement('div');
                div.className = 'food-item';
                div.innerHTML = `
                    <input type="checkbox" id="${itemId}" data-cal="${food.cal}">
                    <label for="${itemId}">${food.name} (${food.cal}大卡)</label>
                `;
                container.appendChild(div);
                
                const checkbox = div.querySelector('input');
                allFoodItems.push({ id: itemId, cal: food.cal, domCheckbox: checkbox });
                checkbox.addEventListener('change', updateTotalAndAdvice);
            });
        }

        function addCustomFood() {
            const nameInput = document.getElementById('customName');
            const calInput = document.getElementById('customCalories');
            const name = nameInput.value.trim();
            const cal = parseFloat(calInput.value);

            if (!name || isNaN(cal) || cal < 0) {
                alert('请输入有效的名称和热量！');
                return;
            }

            const container = document.getElementById('foodListContainer');
            const itemId = `custom-${customIdCounter++}`;
            const div = document.createElement('div');
            div.className = 'food-item';
            div.innerHTML = `
                <input type="checkbox" id="${itemId}" data-cal="${cal}" checked>
                <label for="${itemId}">${name} (${cal}大卡) (自订)</label>
            `;
            container.appendChild(div);

            const checkbox = div.querySelector('input');
            allFoodItems.push({ id: itemId, cal: cal, domCheckbox: checkbox });
            checkbox.addEventListener('change', updateTotalAndAdvice);
            
            nameInput.value = '';
            calInput.value = '';
            updateTotalAndAdvice();
        }

        function calculateRecommendedCalories() {
            const ageRange = document.getElementById('ageSelect').value;
            const gender = document.getElementById('genderSelect').value;
            const activity = parseFloat(document.getElementById('activitySelect').value);

            let age = 25;
            if (ageRange === '12-14') age = 13;
            else if (ageRange === '15-18') age = 16.5;
            else if (ageRange === '19-30') age = 24.5;
            else if (ageRange === '31-50') age = 40.5;
            else if (ageRange === '51-70') age = 60.5;
            else if (ageRange === '71+') age = 75;

            let weight = gender === 'female' ? (age < 18 ? 50 : (age > 60 ? 52 : 55)) : (age < 18 ? 60 : (age > 60 ? 63 : 65));
            let height = gender === 'female' ? 160 : 170;

            let bmr = gender === 'female' 
                ? 10 * weight + 6.25 * height - 5 * age - 161
                : 10 * weight + 6.25 * height - 5 * age + 5;

            return Math.round(bmr * activity);
        }

        function updateTotalAndAdvice() {
            let total = 0;
            allFoodItems.forEach(item => {
                if (item.domCheckbox && item.domCheckbox.checked) {
                    total += item.cal;
                }
            });
            document.getElementById('totalCalories').textContent = total;

            const recommended = calculateRecommendedCalories();
            document.getElementById('targetInfo').textContent = `建议目标：${recommended} 大卡 (每日)`;

            const adviceBox = document.getElementById('adviceBox');
            const diff = total - recommended;
            let msg = '';

            if (total === 0) {
                msg = `🍽️ 今天还没吃东西吗？建议摄取约 <strong>${recommended}</strong> 大卡。`;
            } else if (diff > 300) {
                msg = `⚠️ 超出建议 <strong>${diff}</strong> 大卡。建议增加运动并减少高油高糖食物。`;
            } else if (diff > 100) {
                msg = `🔸 稍微超出建议 <strong>${diff}</strong> 大卡。可以少吃一份点心。`;
            } else if (diff < -300) {
                msg = `⚠️ 不足建议 <strong>${Math.abs(diff)}</strong> 大卡。建议补充优质蛋白质和健康油脂。`;
            } else if (diff < -100) {
                msg = `🔸 略低于建议 <strong>${Math.abs(diff)}</strong> 大卡。可以多吃一份水果或乳制品。`;
            } else {
                msg = `✅ 与建议目标非常接近！继续保持均衡饮食！`;
            }

            adviceBox.innerHTML = msg;
        }

        window.addEventListener('load', () => {
            initFoodList();
            document.getElementById('ageSelect').addEventListener('change', updateTotalAndAdvice);
            document.getElementById('genderSelect').addEventListener('change', updateTotalAndAdvice);
            document.getElementById('activitySelect').addEventListener('change', updateTotalAndAdvice);
            document.getElementById('addCustomBtn').addEventListener('click', addCustomFood);
            updateTotalAndAdvice();
        });
    </script>
</body>
</html>
